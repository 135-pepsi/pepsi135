<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>元源紫泽 MES 物料管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="material-page">
  <header class="topbar">
    <div>
      <h1>元源紫泽 MES 物料管理</h1>
      <p>按订单号快速录入与即时修改 · <span id="systemMode">本地模式</span></p>
    </div>
    <div class="actions">
      <a class="btn" href="index.html">返回订单页面</a>
      <button id="addRowBtn" class="btn btn-primary">+ 新增物料 (Ctrl+N)</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div class="quick-add">
        <input id="qaOrderNo" placeholder="编号(如 030)" />
        <input id="qaCustomer" placeholder="客户(自动带出)" readonly />
        <button id="quickAddBtn" class="btn btn-primary">快速添加行</button>
      </div>
      <div class="filters">
        <input id="searchInput" placeholder="搜索订单号/客户/物料/规格/数量" />
        <button id="addRowInlineBtn" class="btn btn-primary" type="button">+ 添加行</button>
      </div>
    </section>

    <section class="table-wrap" id="tableWrap">
      <table id="orderTable">
        <thead>
          <tr>
            <th>订单号</th>
            <th>客户</th>
            <th>物料</th>
            <th>规格</th>
            <th>数量</th>
            <th>金额</th>
            <th>是否齐备</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <p class="hint">提示：双击单元格可编辑；Enter 保存并跳转下一行同列；</p>
  </main>

  <button id="backTopBtn" class="back-top-btn" title="返回顶部">返回顶部</button>

  <script src="supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="material.js"></script>
</body>
</html>
