name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing secret: SUPABASE_ANON_KEY"
            exit 1
          fi
          echo "Runtime secrets check passed."

      - name: Inject runtime config
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPLOAD_API_BASE: ${{ secrets.UPLOAD_API_BASE }}
          SUPABASE_STORAGE_BUCKET_ORDER_ATTACHMENTS: ${{ secrets.SUPABASE_STORAGE_BUCKET_ORDER_ATTACHMENTS }}
          SUPABASE_STORAGE_BUCKET_TUZHI: ${{ secrets.SUPABASE_STORAGE_BUCKET_TUZHI }}
        run: |
          json_escape() {
            python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$1"
          }
          SUPABASE_URL_JSON="$(json_escape "$SUPABASE_URL")"
          SUPABASE_ANON_KEY_JSON="$(json_escape "$SUPABASE_ANON_KEY")"
          UPLOAD_API_BASE_JSON="$(json_escape "$UPLOAD_API_BASE")"
          SUPABASE_STORAGE_BUCKET_ORDER_ATTACHMENTS_JSON="$(json_escape "${SUPABASE_STORAGE_BUCKET_ORDER_ATTACHMENTS:-order-attachments}")"
          SUPABASE_STORAGE_BUCKET_TUZHI_JSON="$(json_escape "${SUPABASE_STORAGE_BUCKET_TUZHI:-tuzhi}")"
          cat > config.runtime.js << EOF
          window.__MES_CONFIG__ = {
            SUPABASE_URL: ${SUPABASE_URL_JSON},
            SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY_JSON},
            AUTO_REFRESH_SECONDS: 5,
            SUPABASE_STORAGE_BUCKET: "material-screenshots",
            SUPABASE_STORAGE_BUCKET_ORDER_ATTACHMENTS: ${SUPABASE_STORAGE_BUCKET_ORDER_ATTACHMENTS_JSON},
            SUPABASE_STORAGE_BUCKET_TUZHI: ${SUPABASE_STORAGE_BUCKET_TUZHI_JSON},
            SUPABASE_STORAGE_SIGNED_EXPIRES: 3600,
            UPLOAD_API_BASE: ${UPLOAD_API_BASE_JSON},
            UPLOAD_MAX_MB: 50,
            UPLOAD_ACCEPT: ".pdf,.jpg,.jpeg,.png,.dwg,.step,.zip,.rar"
          };
          EOF
          test -s config.runtime.js
          grep -q 'window.__MES_CONFIG__' config.runtime.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
