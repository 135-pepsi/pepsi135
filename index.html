<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>元源紫泽 生产管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>元源紫泽 生产管理系统</h1>
      <p>订单进度看板与明细协同 · <span id="systemMode">本地模式</span> · <span id="lastSyncTime">最近同步 --</span></p>
    </div>
    <div class="actions">
      <div class="actions-row actions-auth-row">
        <span id="authUser" class="auth-user" title="当前登录账号">未登录</span>
        <button id="loginBtn" class="btn" type="button">邮箱登录</button>
        <button id="logoutBtn" class="btn btn-secondary" type="button" style="display:none;">退出登录</button>
      </div>
      <div class="actions-row actions-main-row">
        <button id="reconnectBtn" class="btn btn-secondary" type="button">重连云端</button>
        <a class="btn btn-secondary" href="material.html">物料页面</a>
      </div>
    </div>
  </header>

  <main>
    <section class="kpi-grid" id="kpiGrid">
      <article class="kpi-card kpi-b">
        <span>总单</span>
        <strong id="kpiTotalOrders">0</strong>
      </article>
      <article class="kpi-card kpi-a">
        <span>加工中</span>
        <strong id="kpiInProduction">0</strong>
      </article>
      <article class="kpi-card kpi-c">
        <span>今日交期订单</span>
        <strong id="kpiDueToday">0</strong>
      </article>
      <article class="kpi-card kpi-d">
        <span>异常数</span>
        <strong id="kpiAbnormalCount">0</strong>
      </article>
    </section>
    <section class="board-wrap">
      <div class="board-head">
        <h2>订单进度看板</h2>
        <div id="boardSummary" class="board-summary"></div>
      </div>
      <div id="kanbanBoard" class="kanban-board"></div>
    </section>

    <h2 class="detail-title">订单明细表</h2>
    <section class="order-control-row">
      <div class="order-control-left">
        <select id="filterMonth" title="按订单号月份筛选">
          <option value="">显示全部</option>
          <option value="01">01月</option>
          <option value="02">02月</option>
          <option value="03">03月</option>
          <option value="04">04月</option>
          <option value="05">05月</option>
          <option value="06">06月</option>
          <option value="07">07月</option>
          <option value="08">08月</option>
          <option value="09">09月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
        </select>
        <input id="qaOrderNo" placeholder="编号(如030)" />
        <input id="qaCustomer" placeholder="客户" />
        <button id="quickAddBtn" class="btn btn-primary">新增订单</button>
      </div>
      <div class="order-control-right">
        <button id="compactModeBtn" class="btn btn-secondary" type="button">紧凑模式: 关</button>
        <button id="saveBtn" class="btn btn-secondary" type="button">导出Excel</button>
        <label class="btn btn-secondary upload-btn">
          导入Excel
          <input id="importInput" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden />
        </label>
        <span id="saveFeedback" class="save-feedback" aria-live="polite"></span>
      </div>
    </section>

    <section class="table-wrap" id="tableWrap">
      <table id="orderTable">
        <thead>
          <tr>
            <th>序号</th>
            <th>订单号</th>
            <th>客户</th>
            <th>名称</th>
            <th>图号</th>
            <th>数量</th>
            <th>工序/工时/设备</th>
            <th>表面处理</th>
            <th>状态</th>
            <th>开始时间</th>
            <th>交期</th>
            <th>备注</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
    <div class="table-footer-actions">
      <button id="addBlankBottomBtn" class="btn btn-secondary" type="button">添加空白行</button>
    </div>

    <p class="hint">提示：双击单元格可编辑；Enter 保存并跳转下一行同列；</p>
    <div class="scroll-tail" aria-hidden="true"></div>
  </main>

  <div id="attachmentDialog" class="dialog-backdrop" hidden>
    <section class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="attachmentTitle">
      <header class="dialog-head">
        <h3 id="attachmentTitle">零件图纸</h3>
        <button id="attachmentCloseBtn" class="btn btn-secondary" type="button">关闭</button>
      </header>
      <p id="attachmentSubTitle" class="dialog-subtitle"></p>
      <div class="dialog-upload-row">
        <label class="btn upload-btn">
          选择文件
          <input id="attachmentUploadInput" type="file" hidden />
        </label>
        <span id="attachmentHint" class="dialog-hint"></span>
      </div>
      <div id="attachmentList" class="attachment-list"></div>
    </section>
  </div>

  <div id="previewDialog" class="dialog-backdrop" hidden>
    <section class="dialog-panel preview-panel" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <header class="dialog-head">
        <h3 id="previewTitle">图纸预览</h3>
        <button id="previewCloseBtn" class="btn btn-secondary" type="button">关闭</button>
      </header>
      <p id="previewSubTitle" class="dialog-subtitle"></p>
      <div id="previewBody" class="preview-body"></div>
    </section>
  </div>

  <div id="processTimeDialog" class="dialog-backdrop" hidden>
    <section class="dialog-panel process-time-panel" role="dialog" aria-modal="true" aria-labelledby="processTimeTitle">
      <header class="dialog-head">
        <h3 id="processTimeTitle">预计工时设置</h3>
        <button id="processTimeCloseBtn" class="btn btn-secondary" type="button">关闭</button>
      </header>
      <p id="processTimeSubTitle" class="dialog-subtitle"></p>
      <div class="process-time-form">
        <label class="process-time-field">
          <span>程序单</span>
          <select id="processProgramInput"></select>
        </label>
        <label class="process-time-field">
          <span>总共几序</span>
          <select id="processNameInput"></select>
        </label>
        <label class="process-time-field">
          <span>工时（分钟）</span>
          <input id="processMinutesInput" type="number" min="0" step="1" placeholder="例如 45" />
        </label>
        <label class="process-time-field">
          <span>机台</span>
          <select id="processMachineInput"></select>
        </label>
        <label class="process-time-field">
          <span>车床</span>
          <select id="processLatheInput"></select>
        </label>
      </div>
      <div class="process-time-actions">
        <button id="processTimeCancelBtn" class="btn btn-secondary" type="button">取消</button>
        <button id="processTimeClearBtn" class="btn btn-secondary" type="button">清空</button>
        <button id="processTimeSaveBtn" class="btn btn-primary" type="button">保存</button>
      </div>
    </section>
  </div>

  <div id="statusDialog" class="dialog-backdrop" hidden>
    <section class="dialog-panel status-panel" role="dialog" aria-modal="true" aria-labelledby="statusTitle">
      <header class="dialog-head">
        <h3 id="statusTitle">状态设置</h3>
        <button id="statusCloseBtn" class="btn btn-secondary" type="button">关闭</button>
      </header>
      <p id="statusSubTitle" class="dialog-subtitle"></p>
      <p id="statusProcessContext" class="status-process-context">当前第0序 / 共1序 / 剩余1序</p>
      <div class="status-form">
        <label class="status-field">
          <span>状态</span>
          <select id="statusInput"></select>
        </label>
        <label id="statusStepWrap" class="status-field">
          <span>加工序号</span>
          <select id="statusStepInput"></select>
        </label>
        <p id="statusStepHint" class="status-step-hint"></p>
      </div>
      <div class="status-actions">
        <button id="statusCancelBtn" class="btn btn-secondary" type="button">取消</button>
        <button id="statusNextBtn" class="btn btn-secondary" type="button">下一步</button>
        <button id="statusSaveBtn" class="btn btn-primary" type="button">保存</button>
      </div>
    </section>
  </div>

  <div id="dateDialog" class="dialog-backdrop" hidden>
    <section class="dialog-panel date-panel" role="dialog" aria-modal="true" aria-labelledby="dateTitle">
      <header class="dialog-head">
        <h3 id="dateTitle">日期设置</h3>
        <button id="dateCloseBtn" class="btn btn-secondary" type="button">关闭</button>
      </header>
      <p id="dateSubTitle" class="dialog-subtitle"></p>
      <div class="date-form">
        <label class="date-field">
          <span>月份</span>
          <select id="dateMonthInput"></select>
        </label>
        <label class="date-field">
          <span>日期</span>
          <select id="dateDayInput"></select>
        </label>
      </div>
      <div class="date-actions">
        <button id="dateCancelBtn" class="btn btn-secondary" type="button">取消</button>
        <button id="dateClearBtn" class="btn btn-secondary" type="button">清空</button>
        <button id="dateSaveBtn" class="btn btn-primary" type="button">保存</button>
      </div>
    </section>
  </div>

  <div id="surfaceDialog" class="dialog-backdrop" hidden>
    <section class="dialog-panel surface-panel" role="dialog" aria-modal="true" aria-labelledby="surfaceTitle">
      <header class="dialog-head">
        <h3 id="surfaceTitle">表面处理设置</h3>
        <button id="surfaceCloseBtn" class="btn btn-secondary" type="button">关闭</button>
      </header>
      <p id="surfaceSubTitle" class="dialog-subtitle"></p>
      <div class="surface-form">
        <label class="surface-field">
          <span>常用选项</span>
          <select id="surfacePresetInput"></select>
        </label>
        <label class="surface-field">
          <span>自定义（新增一行）</span>
          <input id="surfaceCustomInput" type="text" placeholder="输入自定义表面处理" />
        </label>
      </div>
      <div class="surface-actions">
        <button id="surfaceCancelBtn" class="btn btn-secondary" type="button">取消</button>
        <button id="surfaceClearBtn" class="btn btn-secondary" type="button">清空</button>
        <button id="surfaceSaveBtn" class="btn btn-primary" type="button">保存</button>
      </div>
    </section>
  </div>

  <button id="backTopBtn" class="back-top-btn" title="返回顶行">返回顶行</button>

  <script src="xlsx.full.min.js"></script>
  <script src="supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
