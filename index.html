<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>元源紫泽 生产管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>元源紫泽 生产管理系统</h1>
      <p>订单进度看板与明细协同 · <span id="systemMode">本地模式</span> · <span id="lastSyncTime">最近同步 --</span></p>
    </div>
    <div class="actions">
      <div class="actions-row actions-auth-row">
        <span id="authUser" class="auth-user" title="当前登录账号">未登录</span>
        <button id="loginBtn" class="btn" type="button">邮箱登录</button>
        <button id="logoutBtn" class="btn btn-secondary" type="button" style="display:none;">退出登录</button>
      </div>
      <div class="actions-row actions-main-row">
        <button id="reconnectBtn" class="btn btn-secondary" type="button">重连云端</button>
        <a class="btn btn-secondary" href="material.html">物料页面</a>
        <button id="saveBtn" class="btn btn-secondary">导出Excel</button>
        <label class="btn upload-btn">
          导入Excel
          <input id="importInput" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden />
        </label>
      </div>
    </div>
  </header>

  <main>
    <section class="kpi-grid" id="kpiGrid">
      <article class="kpi-card kpi-b">
        <span>在制订单</span>
        <strong id="kpiWorkingHours">0</strong>
      </article>
      <article class="kpi-card kpi-a">
        <span>临近交期</span>
        <strong id="kpiPlannedHours">0</strong>
      </article>
      <article class="kpi-card kpi-c">
        <span>今日交期订单</span>
        <strong id="kpiDelayedCount">0</strong>
      </article>
      <article class="kpi-card kpi-d">
        <span>当前时间</span>
        <strong id="kpiCompletion">0</strong>
      </article>
    </section>

    <section class="filters order-filters" id="orderFilters">
      <button id="filterToggleBtn" class="btn btn-secondary filter-toggle" type="button" aria-expanded="true">收起筛选</button>
      <div class="filter-fields" id="orderFilterFields">
        <input id="searchInput" placeholder="搜索订单号/图号/客户" />
        <button id="abnormalFilterBtn" class="btn" type="button">只看异常</button>
        <select id="filterMonth" title="按订单号月份筛选">
          <option value="">全部月份</option>
          <option value="01">01月</option>
          <option value="02">02月</option>
          <option value="03">03月</option>
          <option value="04">04月</option>
          <option value="05">05月</option>
          <option value="06">06月</option>
          <option value="07">07月</option>
          <option value="08">08月</option>
          <option value="09">09月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
        </select>
        <select id="filterMachine">
          <option value="">全部机台</option>
          <option>CNC1</option><option>CNC2</option><option>CNC3</option><option>CNC4</option><option>CNC5</option>
        </select>
        <select id="filterStatus">
          <option value="">全部状态</option>
          <option>待排产</option><option>已排产</option><option>加工中</option><option>完成待检</option><option>返工</option><option>已发货</option>
        </select>
      </div>
    </section>

    <section class="board-wrap">
      <div class="board-head">
        <h2>订单进度看板</h2>
        <div id="boardSummary" class="board-summary"></div>
      </div>
      <div id="kanbanBoard" class="kanban-board"></div>
    </section>

    <section class="toolbar">
      <div class="quick-add">
        <input id="qaOrderNo" placeholder="编号(如030)" />
        <input id="qaCustomer" placeholder="客户" />
        <input id="qaName" placeholder="名称" />
        <input id="qaDrawingNo" placeholder="图号" />
        <input id="qaQty" type="number" min="1" placeholder="数量" />
        <input id="qaHours" type="number" min="0" step="0.1" placeholder="预计工时" />
        <select id="qaMachine">
          <option value="">机台</option>
          <option>CNC1</option><option>CNC2</option><option>CNC3</option><option>CNC4</option><option>CNC5</option>
        </select>
        <input id="qaDueDate" type="date" />
        <button id="quickAddBtn" class="btn btn-primary">快速添加</button>
        <button id="addRowBtn" class="btn">新增订单 (Ctrl+N)</button>
      </div>
    </section>

    <h2 class="detail-title">订单明细表</h2>

    <section class="table-wrap" id="tableWrap">
      <table id="orderTable">
        <thead>
          <tr>
            <th>序号</th>
            <th>订单号</th>
            <th>客户</th>
            <th>名称</th>
            <th>图号</th>
            <th>数量</th>
            <th>程序单</th>
            <th>预计工时</th>
            <th>机台</th>
            <th>车床</th>
            <th>表面处理</th>
            <th>状态</th>
            <th>开始时间</th>
            <th>交期</th>
            <th>是否延期</th>
            <th>备注</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <p class="hint">提示：双击单元格可编辑；Enter 保存并跳转下一行同列；</p>
    <div class="scroll-tail" aria-hidden="true"></div>
  </main>
  <button id="backTopBtn" class="back-top-btn" title="返回顶行">返回顶行</button>

  <script src="xlsx.full.min.js"></script>
  <script src="supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
